<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>longsword</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><span class="sigil">⚔</span><div><b>longsword</b><small>单机战术原型</small></div></div><div class="resources"><span>食物 <b id="food">600</b></span><span>矿产 <b id="ore">600</b></span><span>部队 <b id="population">14 / 40</b></span><span id="clock">00:00</span></div><div class="view-control"><div class="view-head"><span>视角</span><b id="view-name">玩家视角</b></div><input id="perspective" type="range" min="0" max="2" step="1" value="0" aria-label="观察视角"><div class="view-labels"><span>玩家</span><span>全局</span><span>BOT</span></div></div><div class="top-actions"><button id="pause">暂停</button><button id="speed">1×</button><button id="restart">重新开始</button></div></header>
<main><section class="battle"><canvas id="game" aria-label="RTS 战场"></canvas><div class="mission"><div id="mission-intro"><span class="eyebrow">单机战局</span><h1 id="mission-title">夺下双营地</h1><p id="mission-desc">侦察东部资源点，摧毁两座敌方营地。</p></div><span id="objective">敌方营地 2 / 2</span></div><div id="toast" role="status">选择部队，向东部进军。</div><div id="mode-hint">左键选择 · 右键移动</div><div id="result" hidden><span class="eyebrow">行动结束</span><h2 id="result-title"></h2><p id="result-copy"></p><button id="again">再来一局</button><button id="choose-level">更换关卡</button></div><div id="level-select"><span class="eyebrow">longsword · 单机战术原型</span><h1>选择关卡</h1><div class="level-cards"><button class="level-card" data-level="demo"><b>玩法演示</b><span>摧毁东部两座敌方营地，守住主基地。熟悉指挥、建造与经济。</span></button><button class="level-card" data-level="balanced"><b>均衡对抗</b><span>大地图 · 9 组矿产与食物资源。发展经济、集结部队，与会建设和反击的 BOT 对抗。</span></button><button class="level-card" data-level="attack"><b>进攻 · 旧版试玩</b><span>目标：一轮兵力摧毁全部敌方建筑。新规则待制作，当前保留旧版。</span></button><button class="level-card" data-level="defend"><b>防守关卡</b><span>准备 120 秒，抵御 40+20 或 60+30 人两波进攻。我方与第一波等量，保留建筑并消灭全部敌军。</span></button></div></div><div id="connection" hidden>等待主窗口的战局数据…</div></section>
<aside><div class="section-title">战术地图 <span>点击定位</span></div><canvas id="minimap" width="288" height="192" aria-label="战术小地图"></canvas><div class="selection-head"><h2 id="selection-title">未选择部队</h2><span id="selection-count">0</span></div><p id="selection-info">左键拖动，框选蓝色部队。</p><div id="building-actions" hidden><div class="section-title" id="building-title">建造</div><p id="building-info"></p><div id="build-options"><button id="build-base">基地 [C] · 600 矿 / 300 食物</button><button id="build-mine">采矿场 [R] · 400 矿 / 300 食物</button><button id="build-tower">哨塔 [Q] · 200 矿 / 100 食物</button><button id="build-factory">食物厂 [F] · 200 食物 / 100 矿</button></div><div id="base-training" hidden><button id="base-train-shield">训练盾兵 · 50 食物 / 10 矿</button><button id="base-train-archer">训练弓箭兵 · 50 食物 / 10 矿</button><button id="base-train-wilddog">训练野狗 · 40 食物</button><button id="base-train-pigeon">训练信鸽 · 60 食物</button><div class="section-title" style="margin-top:12px">生产队列 <span id="base-queue-count">0 / 50</span></div><div id="base-queue" style="max-height:180px;overflow:auto;margin:7px 0 10px;padding:8px 9px;border:1px solid #3b493b;border-radius:4px;background:#142019;color:#aebca7;font-size:11px;line-height:1.65;white-space:pre-line;font-variant-numeric:tabular-nums">队列为空</div></div><button id="demolish" hidden>拆除（不退款）</button><button id="cancel-build">关闭 / 取消</button></div></aside></main>
<footer><span><span class="dot"></span> <span id="session-label">本地单机</span></span><span>蓝色 · 玩家　 /　 赭红 · BOT</span><span id="zoom-label">100%</span></footer><script type="module" src="src/app.js"></script></body></html>
